name: Build Redshot APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  device-test:
    # real Android (emulator): the real speaker path (AudioTrack), mic + speaker together, flush, long story
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Voice tests on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none
          script: bash -c "set -o pipefail; gradle connectedDebugAndroidTest -PtestAbi=true --stacktrace 2>&1 | tee dt.log"
      - name: Show device test failures
        if: failure()
        run: |
          grep -E "^e: " dt.log 2>/dev/null | head -20 | while IFS= read -r l; do echo "::error::${l:0:400}"; done || true
          grep -rhE "AssertionError|FAILED|Exception" app/build/outputs/androidTest-results 2>/dev/null | head -20 | while IFS= read -r l; do echo "::error::${l:0:400}"; done || true

  unit-test:
    # compile + JVM unit tests, fast feedback with the compiler errors shown as annotations
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Compile and unit tests
        run: |
          set +e
          gradle testDebugUnitTest --stacktrace 2>&1 | tee test.log
          rc=${PIPESTATUS[0]}
          grep -E "^e: |FAILED|AssertionError|Exception|expected" test.log | head -40 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
          grep -rhoE "(message|AssertionError)[^>]{0,300}" app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | head -20 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
          exit $rc

  tatkal-engine-test:
    # the real engine.js against an IRCTC-style (Angular/PrimeNG) replica in headless Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Run engine tests
        run: |
          cd tatkal-test
          python run_tests.py | tee ../engine.log
          rc=${PIPESTATUS[0]}
          grep -E "^FAIL" ../engine.log | head -20 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
          exit $rc

  build:
    needs: [device-test, tatkal-engine-test, unit-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Cache speech model
        id: modelcache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/model-hi
          key: vosk-model-small-hi-0.22

      - name: Download offline speech model (Hindi)
        if: steps.modelcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p app/src/main/assets tmpmodel
          curl -L --fail --retry 3 -o hi.zip https://alphacephei.com/vosk/models/vosk-model-small-hi-0.22.zip
          unzip -q hi.zip -d tmpmodel
          mv tmpmodel/vosk-model-small-hi-0.22 app/src/main/assets/model-hi
          ls -la app/src/main/assets/model-hi

      - name: Cache wake-word model
        id: enmodelcache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/model-en
          key: vosk-model-small-en-us-0.15

      - name: Download wake-word model (English)
        if: steps.enmodelcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p app/src/main/assets tmpmodel2
          curl -L --fail --retry 3 -o en.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q en.zip -d tmpmodel2
          mv tmpmodel2/vosk-model-small-en-us-0.15 app/src/main/assets/model-en

      - name: Cache speaker (voice-print) model
        id: spkcache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/model-spk
          key: vosk-model-spk-0.4

      - name: Download speaker model
        if: steps.spkcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p app/src/main/assets tmpmodel3
          curl -L --fail --retry 3 -o spk.zip https://alphacephei.com/vosk/models/vosk-model-spk-0.4.zip
          unzip -q spk.zip -d tmpmodel3
          mv tmpmodel3/vosk-model-spk-0.4 app/src/main/assets/model-spk
          ls -la app/src/main/assets/model-spk

      - name: Unit tests (voice player + barge-in logic) - the APK is only built if these pass
        run: |
          set +e
          gradle testDebugUnitTest --stacktrace 2>&1 | tee test.log
          rc=${PIPESTATUS[0]}
          grep -E "^e: |FAILED|AssertionError|Exception" test.log | head -30 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
          exit $rc

      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug -PbuildNum=${{ github.run_number }} --stacktrace 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          grep -E "^e: |error:" build.log | head -40 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
          exit $rc

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk redshot.apk

      - uses: actions/upload-artifact@v4
        with:
          name: redshot-apk
          path: redshot.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          name: Redshot build ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: redshot.apk
          make_latest: true
